name: condiff
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  # PyTorch 2.7+ requires Python 3.10+; use 3.11 for broad wheel support.
  - python=3.11
  - pip
  - numpy>=1.26,<3
  - click>=8.0
  - pillow>=8.3.1
  - scipy>=1.11
  - psutil
  - requests
  - tqdm
  - imageio
  - matplotlib
  # Training / config (Hydra CLI overrides: dataset_kwargs=..., runs=...)
  - hydra-core>=1.3
  - omegaconf>=2.3
  - pip:
    - -r requirements-gpu.txt
    # Optional; only used by legacy ImageFolder dataset (src/training/dataset.py).
    - pyspng
